<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamflix — Stream Movies</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #141414; color: #ffffff; overflow-x: hidden; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 4%;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .logo { color: #E50914; font-size: 28px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }

        .hero {
            position: relative;
            height: 70vh;
            background: linear-gradient(to top, #141414 10%, transparent 50%),
                        linear-gradient(to right, rgba(20,20,20,0.95) 20%, rgba(20,20,20,0) 65%),
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            padding: 0 4%;
        }

        .hero-content { max-width: 580px; margin-top: 40px; }
        .hero-title { font-size: 48px; font-weight: 800; margin-bottom: 12px; }
        .hero-desc { font-size: 15px; color: #D2D2D2; margin-bottom: 20px; line-height: 1.4; }

        .btn-play {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background-color: #FFFFFF;
            color: #000000;
        }

        .btn-play:hover { background-color: rgba(255, 255, 255, 0.75); }

        .content-container { padding: 0 4% 60px 4%; margin-top: -30px; position: relative; z-index: 10; }
        .row-title { font-size: 20px; font-weight: 700; color: #E5E5E5; margin-bottom: 14px; }

        .row-cards { display: flex; gap: 12px; overflow-x: auto; padding: 12px 0; }
        .row-cards::-webkit-scrollbar { display: none; }

        .card {
            flex: 0 0 auto;
            width: 200px;
            height: 290px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
            background: #1F1F1F;
        }

        .card:hover { transform: scale(1.08); z-index: 20; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }

        /* Modal Player Overlay */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 90%;
            height: 80vh;
            max-width: 1100px;
            border-radius: 8px;
            border: none;
        }

        .back-btn {
            position: absolute;
            top: 25px;
            left: 30px;
            background: #E50914;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            z-index: 1010;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zamflix</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Big Buck Bunny</h1>
            <p class="hero-desc">An iconic open-source animated film. Click play to stream instant video playback directly on your site.</p>
            <button class="btn-play" onclick="playStream('https://www.youtube.com/embed/aqz-KE-bpKQ')">▶ Play Now</button>
        </div>
    </section>

    <main class="content-container">
        <h2 class="row-title">Featured Titles</h2>
        <div class="row-cards" id="movie-grid"></div>
    </main>

    <div id="player-modal">
        <button class="back-btn" onclick="closePlayer()">← Back to Zamflix</button>
        <iframe id="video-frame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        const catalog = [
            {
                title: "Big Buck Bunny",
                streamUrl: "https://www.youtube.com/embed/aqz-KE-bpKQ",
                poster: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg"
            },
            {
                title: "Tears of Steel",
                streamUrl: "https://www.youtube.com/embed/R6MlUcmOul8",
                poster: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Tears_of_Steel_poster.jpg"
            },
            {
                title: "Sintel",
                streamUrl: "https://www.youtube.com/embed/eRsGyueVLvQ",
                poster: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Sintel_poster.jpg"
            }
        ];

        const grid = document.getElementById('movie-grid');
        catalog.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => playStream(movie.streamUrl);
            card.innerHTML = `
                <img src="${movie.poster}" alt="${movie.title}">
                <div class="card-title">${movie.title}</div>
            `;
            grid.appendChild(card);
        });

        function playStream(url) {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            iframe.src = url + "?autoplay=1";
            modal.style.display = 'flex';
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            iframe.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
